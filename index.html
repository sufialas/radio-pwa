<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Dunia</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">

<style>
body { font-family: Arial; margin: 15px; }
button { padding: 5px 10px; margin-top: 5px; }
li { margin-bottom: 10px; }
</style>

</head>
<body>

<h2>🌍 Radio Online Dunia</h2>

<input type="text" id="search" placeholder="Cari radio...">
<button onclick="searchRadio()">Cari</button>

<ul id="radioList"></ul>

<audio id="player" controls style="width:100%; position:fixed; bottom:0;"></audio>

<script>

async function searchRadio() {
  let keyword = document.getElementById("search").value;

  let response = await fetch(
    "https://de1.api.radio-browser.info/json/stations/search?name=" + keyword
  );

  let data = await response.json();
  let list = document.getElementById("radioList");
  list.innerHTML = "";

  data.slice(0, 20).forEach(station => {
    let li = document.createElement("li");
    li.innerHTML = `
      <b>${station.name}</b> - ${station.country}<br>
      <button onclick="playRadio('${station.url_resolved}')">Play</button>
      <hr>
    `;
    list.appendChild(li);
  });
}

function playRadio(url) {
  let player = document.getElementById("player");
  player.src = url;
  player.play();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

</script>

</body>
</html>
